# =========================================================
# Configuration Nginx du portfolio
# À copier sur le VPS dans : /etc/nginx/sites-available/portfolio
# Remplace "votre-domaine.fr" par ton domaine (ou l'IP du VPS).
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.fr www.votre-domaine.fr;

    # Dossier où le dépôt GitHub est cloné
    root /var/www/portfolio;
    index index.html;

    # Page 404 personnalisée
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Ne jamais servir les fichiers internes du dépôt
    location ~ /\.(?!well-known) { deny all; return 404; }   # .git, .gitignore...
    location ^~ /deploy/          { deny all; return 404; }
    location = /README.md         { deny all; return 404; }

    # Cache navigateur pour les fichiers statiques
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
}
